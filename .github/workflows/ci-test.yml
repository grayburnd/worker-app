name: CI [Test] (Callable ONLY)

on:

  workflow_call:
    # inputs:
    #   uv-version:
    #     required: true
    #     type: string

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "AWS_ACCOUNT_ID_REDACTED"
  APP: "voting-worker"
  OIDC_ROLE_NAME: "gh_actions"

permissions:
  id-token: write
  contents: read

jobs:
  ci-tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Create interpolated env var
        run: echo "DOCKER_IMAGE_URI=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.APP }}:${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV

      - name: Checkout local Git Repo
        uses: actions/checkout@v7.0.1

      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.OIDC_ROLE_NAME }}

      - name: Login to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build and tag docker image
        run: |
          docker build --pull --no-cache . -t ${{ env.DOCKER_IMAGE_URI }}

      - name: Push docker image
        run: |
          docker push ${{ env.DOCKER_IMAGE_URI }}

      # - name: Run Trivy vulnerability scanner
