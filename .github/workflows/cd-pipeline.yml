name: CD Pipeline
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - closed
permissions:
  contents: read
  id-token: write
  pull-requests: write
jobs:
  ##Only deploy if the PR was merged to Main. Single branch only.
  deploy:
    if: github.event.pull_request.merged == true
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local Git Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Updatecli in the runner
        uses: updatecli/updatecli-action@v3.6.0

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.OIDC_ROLE_NAME }}

      #https://github.com/actions/create-github-app-token
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          # required
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run Updatecli in Apply mode
        run: |
         updatecli pipeline apply --config updatecli/updatecli.yaml
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_IMAGE_TAG: ${{ github.event.pull_request.head.sha }}
          OWNER: ${{ github.repository_owner }}
          TARGET_REPOSITORY: "private-gitops-values"
          TARGET_BRANCH: "main"
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          APP: ${{ vars.APP }}
          TEAM: ${{ vars.TEAM }}
