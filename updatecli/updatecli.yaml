name: GitOps Image Tag updater ##Parameterise this next.
sources:
  imageTag:
    name: Get image tag from environment variable
    kind: shell
    spec:
      command: echo $TARGET_IMAGE_TAG
      environments:
        - name: TARGET_IMAGE_TAG

scms:
  default:
    kind: github
    spec:
      owner: "{{ requiredEnv `OWNER` }}"
      repository: "{{ requiredEnv `TARGET_REPOSITORY` }}"
      token: "{{ requiredEnv `UPDATECLI_GITHUB_TOKEN` }}"
      branch: "{{ requiredEnv `TARGET_BRANCH` }}"
      workingbranchprefix: feature/image_tag/{{ requiredEnv `TARGET_IMAGE_TAG` }}
      commitmessage:
        # produces "deps(charts): <target name>"
        type: chore
        scope: image_tag
        # remove the "Made with ❤️ by updatecli" line from the commit body
        hidecredit: false
        # squash every commit of the working branch into one, using the body below
        squash: true
        body: |
          This commit was generated by Automation, using Updatecli.

# "targets" describe what to update with the source value.
# Here: the key "$.container.tag" of the file "data.yaml".
targets:
  dataFile:
    name: Bump the target Docker image tag
    kind: yaml
    scmid: default
    spec:
      file: '{{ requiredEnv `TEAM` }}-gitops/apps/{{ requiredEnv `APP` }}/{{ requiredEnv `ENVIRONMENT` }}-values.yml'
      key: $.image.tag

actions:
  default:
    kind: github/pullrequest
    scmid: default
    spec:
      title: "chore(image_tag): update {{ requiredEnv `APP` }} image tag"
      description: "Automated PR to update the Docker image tag of the {{ requiredEnv `APP` }} app."
